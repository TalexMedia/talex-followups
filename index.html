<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Talex Follow-ups</title>

<link rel="shortcut icon" href="https://static.wixstatic.com/media/3c6878_9a68ae0b3ff84e198fdd43fac493e294~mv2_d_1500_1500_s_2.png/v1/fill/w_32,h_32,lg_1,usm_0.66_1.00_0.01/3c6878_9a68ae0b3ff84e198fdd43fac493e294~mv2_d_1500_1500_s_2.png" type="image/png"/>
<link rel="apple-touch-icon" href="https://static.wixstatic.com/media/3c6878_9a68ae0b3ff84e198fdd43fac493e294~mv2_d_1500_1500_s_2.png/v1/fill/w_180,h_180,lg_1,usm_0.66_1.00_0.01/3c6878_9a68ae0b3ff84e198fdd43fac493e294~mv2_d_1500_1500_s_2.png"/>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --o:#E85A0C;--o-dim:rgba(232,90,12,0.08);--o-border:rgba(232,90,12,0.28);
  --bg:#F5F2EC;--surface:#FFFFFF;--surface2:#FAF8F5;--border:#E2DDD6;--border-strong:#C8C2BA;
  --txt:#1A1816;--txt2:#6B625A;--txt3:#A89E96;
  --green:#2D8C52;--green-bg:#EDF7F2;--green-border:#A8D9BC;
  --red:#C0392B;--red-bg:#FDF0EE;--red-border:#E8BEBC;
  --amber:#B07D10;--amber-bg:#FDF7EC;--amber-border:#E0C880;
  --blue:#2f5a8a;--blue-bg:#eef3f9;--blue-border:#b9c7da;
}
*{box-sizing:border-box}
html{background:var(--bg);color:var(--txt);font-family:'DM Sans',system-ui,sans-serif;font-size:15px;line-height:1.55}
body{margin:0;background:var(--bg);min-height:100vh}
#wrap{max-width:780px;margin:0 auto;padding:0 16px 5rem}
header{padding:24px 0 12px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;margin-bottom:10px}
.brand img{height:28px;width:auto}
.brand span{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.08em;color:var(--txt)}
h1{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:2.4rem;letter-spacing:.02em;margin:0;line-height:1}
h1 span{color:var(--o)}
.sub{color:var(--txt2);font-size:.85rem;margin-top:4px}
.me{font-size:.85rem;color:var(--txt2)}
.me select{font:inherit;padding:4px 6px;border:1px solid var(--border-strong);border-radius:6px;background:var(--surface)}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--border)}
.tabs{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 2px;padding:2px 2px 10px;scrollbar-width:thin;-webkit-overflow-scrolling:touch;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
.tabs::-webkit-scrollbar{height:4px}.tabs::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:4px}
.tab{--c:var(--txt);--cb:var(--surface2);flex:0 0 auto;scroll-snap-align:start;min-width:0;display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:center;text-align:left;font:inherit;color:var(--txt);background:var(--surface);border:1px solid var(--border);border-top:4px solid var(--c);border-radius:12px;padding:10px 14px 10px 12px;cursor:pointer;transition:transform .12s,box-shadow .12s}
.tab:hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(0,0,0,.06)}
.tab .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--cb);color:var(--c)}
.tab .ic svg{width:18px;height:18px}
.tab .t{font-weight:700;font-size:.92rem;display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.tab .n{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;line-height:1;color:var(--c);font-weight:400}
.tab[aria-pressed=true]{background:var(--c);border-color:var(--c);color:#fff}
.tab[aria-pressed=true] .ic{background:rgba(255,255,255,.18);color:#fff}
.tab[aria-pressed=true] .n{color:rgba(255,255,255,.88)}
.tab.todo{--c:var(--o);--cb:var(--o-dim)}.tab.waiting{--c:var(--amber);--cb:var(--amber-bg)}.tab.docs{--c:var(--blue);--cb:var(--blue-bg)}.tab.archive{--c:var(--green);--cb:var(--green-bg)}.tab.leads{--c:#2B2B2B;--cb:var(--surface2)}.tab.tasks{--c:#6B4FA0;--cb:#F3EFF9}.tab.suggested{--c:#0F7A78;--cb:#E8F5F4}.tab.ttn{--c:#8A5A1E;--cb:#F7EFE4}
.ttnrow .ttl{font-weight:700;font-size:1rem}.ttnrow.isdone .ttl{text-decoration:line-through;color:var(--txt3)}
.ttnq{margin:0 16px 10px;padding:8px 12px;border-left:3px solid #8A5A1E;background:#F7EFE4;border-radius:0 8px 8px 0;font-size:.9rem;white-space:pre-wrap}
.ttnf{padding:0 16px 6px;font-size:.9rem}.ttnf b{font-weight:600}
.ttngroup{font-size:.8rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--txt2);margin:18px 0 4px}
.sugg .from{font-size:.8rem;color:var(--txt3);padding:0 16px 6px}
.sugg .kind{border-color:#9FD3CF;color:#0F7A78;background:#E8F5F4}
.sugg .was{margin:6px 16px;padding:10px 14px;border:1px dashed var(--border-strong);border-radius:8px;color:var(--txt3);font-size:.88rem;white-space:pre-wrap}
.task .ttl{font-weight:700;font-size:1rem}
.task.isdone .ttl{text-decoration:line-through;color:var(--txt3)}
.donelist summary{cursor:pointer;color:var(--txt2);font-size:.9rem;padding:8px 0}
.subbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.who{font:inherit;font-size:.85rem;border:1px solid var(--border);background:transparent;color:var(--txt2);padding:5px 10px;border-radius:999px;cursor:pointer}
.who[aria-pressed=true]{border-color:var(--o);color:var(--o);background:var(--o-dim)}
.add{font:inherit;font-weight:700;border:0;background:var(--o);color:#fff;padding:7px 14px;border-radius:999px;cursor:pointer}
#status{font-size:.8rem;color:var(--txt3);padding:8px 0 0;min-height:1.6em}
#status.err{color:var(--red)}
h2{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:1.4rem;letter-spacing:.03em;margin:22px 0 4px;color:var(--txt2)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin:14px 0;overflow:hidden}
.card.overdue{border-left:4px solid var(--red)}
.card.today{border-left:4px solid var(--o)}
.top{padding:14px 16px 10px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.lead{font-weight:700;font-size:1.05rem}
.lead a{color:inherit;text-decoration:none;border-bottom:1px dashed var(--border-strong);cursor:pointer}
.co{color:var(--txt2);font-weight:400}
.lead .sub{font-size:.8rem;font-weight:400;color:var(--txt3);margin-top:2px;line-height:1.4}
.lead .sub a,.convhead .det a{color:#0A66C2;text-decoration:none;font-weight:500;white-space:nowrap}
.convhead .ttl{font-size:.92rem;color:var(--txt);margin-top:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{font-size:.75rem;font-weight:500;padding:2px 8px;border-radius:999px;border:1px solid var(--border);color:var(--txt2);background:var(--surface2);white-space:nowrap}
.chip.tom{border-color:var(--o-border);color:var(--o);background:var(--o-dim)}
.chip.evan{border-color:var(--blue-border);color:var(--blue);background:var(--blue-bg)}
.chip.due-over{border-color:var(--red-border);color:var(--red);background:var(--red-bg)}
.chip.due-today{border-color:var(--amber-border);color:var(--amber);background:var(--amber-bg)}
.chip.sent{border-color:var(--green-border);color:var(--green);background:var(--green-bg)}
.note{padding:0 16px 10px;color:var(--txt2);font-size:.9rem}
.meta{margin:0 16px;border-top:1px solid var(--border);font-size:.88rem}
.meta div{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--border)}
.meta b{width:60px;flex:none;color:var(--txt3);font-weight:500}
.meta span{word-break:break-word}
.msg{margin:12px 16px;padding:14px 16px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;white-space:pre-wrap;word-break:break-word;font-size:.95rem;line-height:1.6}
.msg a,.links a,.conv a{color:var(--o)}
.links{padding:0 16px 8px;font-size:.88rem;display:flex;flex-direction:column;gap:4px}
.nomsg{margin:12px 16px;color:var(--txt3);font-style:italic;font-size:.9rem}
.lastsent{margin:0 16px 10px}.lastsent summary{cursor:pointer;color:var(--txt2);font-size:.85rem}.lastsent .msg{margin:8px 0 0}
.actions{padding:10px 16px 14px;display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-size:.88rem;font-weight:500;border:1px solid var(--border-strong);background:var(--surface);color:var(--txt);padding:7px 12px;border-radius:8px;cursor:pointer}
.btn.primary{background:var(--txt);color:#fff;border-color:var(--txt)}
.btn.go{background:var(--green);color:#fff;border-color:var(--green)}
.btn.link{border:0;background:transparent;color:var(--o);padding:7px 4px}
.log{padding:0 16px 12px;font-size:.78rem;color:var(--txt3)}
.edit{padding:4px 16px 4px}
.edit label{display:block;font-size:.78rem;color:var(--txt2);margin:8px 0 3px}
.edit input,.edit textarea,.edit select{width:100%;font:inherit;font-size:.92rem;padding:8px 10px;border:1px solid var(--border-strong);border-radius:8px;background:#fff;color:var(--txt)}
.edit textarea{min-height:200px;line-height:1.55}
.edit .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.conflict{margin:10px 16px;padding:10px 12px;border:1px solid var(--amber-border);background:var(--amber-bg);border-radius:8px;font-size:.88rem}
.empty{color:var(--txt2);text-align:center;padding:40px 0}
.nokey{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;margin-top:24px}
.search{width:100%;font:inherit;padding:9px 12px;border:1px solid var(--border-strong);border-radius:10px;background:var(--surface);margin:14px 0 4px}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;width:100%;font:inherit;text-align:left;color:inherit}
.lrow:hover{border-color:var(--border-strong)}
.lrow small{display:block;color:var(--txt2);font-size:.82rem}
.arow{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin:10px 0;padding:12px 14px}
.arow .hd{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.88rem}
.arow .hd b a{color:inherit;cursor:pointer;border-bottom:1px dashed var(--border-strong)}
.arow details summary{cursor:pointer;color:var(--txt2);font-size:.85rem;margin-top:6px}
.arow details .msg{margin:8px 0 0}
.convhead{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin:14px 0}
.convhead .nm{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;line-height:1;letter-spacing:.02em}
.convhead .det{color:var(--txt2);font-size:.88rem;margin-top:6px;word-break:break-word}
.conv{position:relative;margin:10px 0 20px;padding-left:18px;border-left:2px solid var(--border)}
.ev{position:relative;margin:0 0 14px}
.ev:before{content:'';position:absolute;left:-24px;top:14px;width:10px;height:10px;border-radius:50%;background:var(--border-strong);border:2px solid var(--bg)}
.ev.out:before{background:var(--o)}
.ev.in:before{background:var(--blue)}
.ev.call:before{background:var(--green)}
.ev .box{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 14px}
.ev.out .box{background:#fff8f3;border-color:var(--o-border)}
.ev.in .box{background:var(--blue-bg);border-color:var(--blue-border)}
.ev.call .box{background:var(--green-bg);border-color:var(--green-border)}
.ev .h{font-size:.8rem;color:var(--txt2);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ev .h b{color:var(--txt)}
.ev .s{font-weight:500;font-size:.9rem;margin-top:4px}
.ev .t{white-space:pre-wrap;word-break:break-word;font-size:.92rem;margin-top:4px}
.ch{font-size:.72rem;font-weight:700;border-radius:999px;padding:0 7px;border:1px solid var(--border)}
.ch.Email{color:var(--blue);border-color:var(--blue-border);background:#fff}
.ch.LinkedIn{color:#fff;background:#0A66C2;border-color:#0A66C2}
.ch.Call{color:var(--green);border-color:var(--green-border);background:#fff}
.chip.newreply{border-color:#0A66C2;color:#fff;background:#0A66C2}
.replybox{margin:4px 16px 10px;border-left:3px solid #0A66C2;background:#EEF4FB;border-radius:0 8px 8px 0;padding:8px 0 2px}
.replybox .rh{font-size:.82rem;font-weight:700;color:#0A66C2;padding:0 14px}
.replybox .msg{margin:6px 14px 8px;background:#fff}
.chip.flag{border-color:var(--red-border);color:var(--red);background:var(--red-bg)}
.flagwhy{margin:0 16px 10px;padding:8px 12px;border-left:3px solid var(--red);background:var(--red-bg);font-size:.9rem}
.cf{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.ev .sum{font-size:.72rem;color:var(--txt3);border:1px solid var(--border);border-radius:999px;padding:0 6px}
@media (max-width:560px){h1{font-size:2rem}.edit .row{grid-template-columns:1fr}.meta b{width:52px}}
</style>
</head>
<body>
<div id="wrap">
  <header>
    <div>
      <a class="brand" href="https://www.talexmedia.com" target="_blank" rel="noopener"><img src="https://static.wixstatic.com/media/3c6878_456d81e9cdb84e6c8bb3260ebfcc0523~mv2.png" alt="Talex Media"><span>Talex Media</span></a>
      <h1>Follow-<span>ups</span></h1>
    </div>
    <div class="me">I am <select id="me"><option value="">pick</option><option>Tom</option><option>Evan</option></select></div>
  </header>
  <div id="app"></div>
</div>
<script>
(function(){
var DB='https://talex-media-default-rtdb.firebaseio.com/drafts/';
var KEY=(location.hash.match(/k=([a-z0-9-]{6,80})/)||[])[1]||'';
var app=document.getElementById('app');
var meSel=document.getElementById('me');
var TABS={suggested:'Suggested',todo:'Not sent yet',waiting:'Waiting on reply',tasks:'Tasks',docs:'Docs to review',archive:'Archive',leads:'Leads',ttn:'TTN'};
var SV='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">';
var TABICON={ttn:SV+'<path d="M3 21h18M5 21V7l7-4 7 4v14"/><path d="M9 21v-5h6v5M9 10h.01M15 10h.01M12 10h.01"/></svg>',suggested:SV+'<path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/><circle cx="12" cy="12" r="3"/></svg>',tasks:SV+'<rect x="3" y="3" width="18" height="18" rx="4"/><path d="m8 12 3 3 5-6"/></svg>',todo:SV+'<path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>',waiting:SV+'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',docs:SV+'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>',archive:SV+'<rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9M10 13h4"/></svg>',leads:SV+'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 20a6.5 6.5 0 0 0-3-5.5"/></svg>'};
var cards={},leads={},docs={},tasks={},suggestions={},ttn={},editingTtn={},editingTask={},editingDoc={},view='todo',owner='All',openLead=null,convFilter='All',leadQuery='',editing={},conflicts={},flagging={},adding=null,loadedOnce=false;

function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
meSel.value=store('fu-me')||'';
meSel.onchange=function(){store('fu-me',meSel.value)};
view=store('fu-view')||'todo';if(!TABS[view])view='todo';owner=store('fu-owner')||'All';

if(!KEY){app.innerHTML='<div class="nokey"><b>This link is missing its key.</b><p>Open the board with the full link Evan sent you. It ends in <code>#k=…</code>.</p></div>';return}
var ROOT=DB+KEY;

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function linkify(s){return esc(s).replace(/https?:\/\/[^\s<]+[^\s<.,;:!?)]/g,function(u){return '<a href="'+u+'" target="_blank" rel="noopener">'+u+'</a>'})}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function isoOf(ms){var d=new Date(ms);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmtDate(iso){if(!iso)return'';var p=iso.split('-');var d=new Date(+p[0],+p[1]-1,+p[2]);return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}
function fmtDay(iso){if(!iso)return'';var p=iso.split('-');var d=new Date(+p[0],+p[1]-1,+p[2]);return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}
function fmtWhen(ms){var d=new Date(ms);return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}
function who(){return meSel.value||'Someone'}
function slug(s){return String(s||'').toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60)||'lead'}
function setStatus(t,err){var s=document.getElementById('status');if(s){s.textContent=t||'';s.className=err?'err':''}}
function list(){return Object.keys(cards).map(function(k){return cards[k]}).filter(Boolean)}
function hist(lid){var h=(leads[lid]&&leads[lid].history)||{};return Object.keys(h).map(function(k){var e=h[k];e._id=k;return e}).filter(Boolean).sort(function(a,b){return(a.date||'').localeCompare(b.date||'')||(a.at||0)-(b.at||0)})}
function replyOf(c){
  var l=c.leadId&&leads[c.leadId];var after=c.sentAt||(c.lastSent&&c.lastSent.at)||0;if(!l||!after)return null;
  var r=hist(c.leadId).filter(function(e){return e.dir==='in'&&(e.at||0)>after}).pop();if(!r)return null;
  var t=String(r.text||'').split(/\n\s*(?:From: |-{2,}\s*Original Message|On .{0,300}wrote:)/)[0].replace(/\n{3,}/g,'\n\n').trim();
  return{e:r,text:t.length>1200?t.slice(0,1200)+'…':t};
}
function hasNewReply(c){var l=c.leadId&&leads[c.leadId];return!!(l&&l.lastInboundAt&&c.status!=='done'&&c.sentAt&&l.lastInboundAt>c.sentAt)}
function chanOf(e){return e.dir==='call'||e.channel==='Call'?'Call':e.channel==='LinkedIn'?'LinkedIn':e.channel==='Email'?'Email':'Other'}
function leadName(lid){return(leads[lid]&&leads[lid].name)||lid}
function busy(){return Object.keys(editing).length||Object.keys(editingDoc).length||Object.keys(editingTask).length||Object.keys(editingTtn).length||Object.keys(flagging).length||adding}

function load(quiet){
  return fetch(ROOT+'.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(function(v){
    v=v||{};cards=v.cards||{};leads=v.leads||{};docs=v.docs||{};tasks=v.tasks||{};suggestions=v.suggestions||{};ttn=v.ttn||{};loadedOnce=true;render();
    if(!quiet)setStatus('Up to date '+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}));
    surfaceReplies();expireWaiting();sendTasks();
  }).catch(function(e){setStatus('Could not load the board ('+e.message+'). Check your connection and refresh.',true);if(!loadedOnce)render()});
}

// Waiting on reply is the "not yet" pile (Evan, 5 Nov). On its check date a card
// comes back by itself: an email goes to Not sent yet as "Follow-up due" (Claude
// drafts it), anything else becomes a task. Each move is a compare-and-set that
// first re-checks the saved card, so two open pages never move it twice.
// push.py expire does the same from the command line.
var expiring=false;
function inDays(n){return isoOf(Date.now()+n*864e5)}
function boardLog(c,what){c.log=(c.log||[]).concat([{at:Date.now(),by:'Board',what:what}]).slice(-12)}
function lastSentOf(c){return{at:c.sentAt||0,channel:c.channel||'',subject:c.subject||'',body:c.body||''}}
function surfaceReplies(){
  var back=list().filter(function(c){return c.status==='waiting'&&hasNewReply(c)});
  back.forEach(function(c0){saveCard(c0.id,function(c){
    if(!c||c.status!=='waiting')return false;
    c.lastSent=lastSentOf(c);c.status='todo';c.replied=true;c.followup=null;c.body='';c.due=today();
    boardLog(c,'moved to Not sent yet: '+(c.lead||'they').split(' ')[0]+' replied');return c;
  }).then(function(r){if(r)render()}).catch(function(){})});
}
function expireWaiting(){
  if(expiring)return;var t=today();
  var due=list().filter(function(c){return c.status==='waiting'&&c.due&&c.due<=t&&!hasNewReply(c)}); // a reply is not a follow-up
  if(!due.length)return;expiring=true;
  var chain=Promise.resolve(),moved=0;
  due.forEach(function(c0){chain=chain.then(function(){
    var isEmail=(c0.channel||'Email')==='Email',snap=null;
    return saveCard(c0.id,function(c){
      if(!c||c.status!=='waiting'||!c.due||c.due>t||hasNewReply(c))return false;
      snap=JSON.parse(JSON.stringify(c));
      if(isEmail){c.lastSent=lastSentOf(c);c.status='todo';c.followup=true;c.body='';c.due=t;boardLog(c,'moved to Not sent yet: no reply by the check date')}
      else{c.status='done';boardLog(c,'moved to Tasks: no reply by the check date')}
      return c;
    }).then(function(r){
      if(!r)return;moved++;if(isEmail)return;
      var tid='followup-'+snap.id+'-'+t;
      var notes=(snap.note?snap.note+'\n\n':'')+'Last sent'+(snap.sentAt?' '+fmtDay(isoOf(snap.sentAt)):'')+(snap.channel?' ('+snap.channel+')':'')+(snap.to?' to '+snap.to:'')+':\n'+(snap.body||'(no copy kept)')+((snap.links||[]).length?'\n\n'+snap.links.map(function(l){return(l.label?l.label+': ':'')+l.url}).join('\n'):'');
      return saveItem('tasks',tid,function(cur){if(cur)return false;return{id:tid,title:'Follow up: '+(snap.lead||'')+(snap.company?' ('+snap.company+')':'')+', no reply yet',owner:snap.owner||'Tom',due:t,notes:notes,leadId:snap.leadId||'',status:'open',fromCard:snap.id,log:[{at:Date.now(),by:'Board',what:'added this task: no reply by the check date'}]}});
    });
  }).catch(function(){})});
  chain.then(function(){expiring=false;if(moved){setStatus(moved+(moved===1?' item':' items')+' came back from Waiting on reply: the check date has passed.');render()}});
}
// A doc marked ready to send becomes a send task by itself (Evan, 6 Nov: "it
// should be automatic"). Sharing the doc closes that task. push.py doctasks
// does the same from the hourly check, so it happens with no page open too.
function sendTaskOf(d){
  var lead=d.lead||'the lead',ty=(d.type||'doc').toLowerCase();
  return{id:'send-'+d.id,title:'Send the '+(d.company||'')+' '+ty+' to '+lead,owner:d.sender||'Evan',due:d.sendBy||today(),leadId:d.leadId||'',docId:d.id,status:'open',
    notes:'Tom marked the '+ty+' ready to send. Before it goes out, Claude bakes in any edits saved on the link and switches editing off: tell Claude to go. Then send it to '+lead+' and tap Shared on the doc in Docs to review, which closes this task.\n\n'+(d.link||''),
    log:[{at:Date.now(),by:'Board',what:'added this task: the doc was marked ready to send'}]};
}
function sendTasks(){
  docList().forEach(function(d){
    var tid='send-'+d.id,t=tasks[tid];
    if(d.status==='ready'&&!t)saveItem('tasks',tid,function(cur){return cur?false:sendTaskOf(d)}).then(function(r){if(r)render()}).catch(function(){});
    if(d.status==='shared'&&t&&t.status!=='done')saveItem('tasks',tid,function(cur){
      if(!cur||cur.status==='done')return false;
      cur.status='done';cur.doneAt=d.sharedAt||Date.now();cur.doneBy=d.sharedBy||'';boardLog(cur,'closed it: the doc was shared');return cur;
    }).then(function(r){if(r)render()}).catch(function(){});
  });
}
function put(path,val){return fetch(ROOT+path+'.json',{method:'PUT',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify(val)}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return val})}

// Compare-and-set on one card: read it with its ETag, apply the change to the
// saved copy, write back only if nobody saved in between, retry if they did.
function saveCard(id,mutate){return saveItem('cards',id,mutate)}
function saveItem(coll,id,mutate,tries){
  tries=tries||0;var url=ROOT+'/'+coll+'/'+encodeURIComponent(id)+'.json';
  return fetch(url,{cache:'no-store',headers:{'X-Firebase-ETag':'true'}}).then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status);var etag=r.headers.get('ETag');
    return r.json().then(function(cur){return{etag:etag,cur:cur}});
  }).then(function(x){
    var next=mutate(x.cur?JSON.parse(JSON.stringify(x.cur)):null);
    if(next===false)return false;
    next.rev=((x.cur&&x.cur.rev)||0)+1;next.updatedAt=Date.now();
    return fetch(url,{method:'PUT',cache:'no-store',headers:{'if-match':x.etag,'Content-Type':'application/json'},body:JSON.stringify(next)}).then(function(r){
      if(r.status===412&&tries<2)return saveItem(coll,id,mutate,tries+1);
      if(!r.ok)throw new Error('HTTP '+r.status);({docs:docs,tasks:tasks,cards:cards,suggestions:suggestions,ttn:ttn})[coll][id]=next;
      var nl=(next.log||[]).slice(-1)[0],ol=x.cur&&(x.cur.log||[]).slice(-1)[0];
      if(nl&&(!ol||nl.at!==ol.at||nl.what!==ol.what))logActivity(coll,id,next,nl);
      return next;
    });
  });
}
// Every action on the board also goes to /activity, which is never trimmed (a
// card keeps only its last 12 log lines). The hourly check reads it and tells
// Evan what Tom did (Evan, 6 Nov: "capture is super important").
function itemLabel(coll,x){
  if(coll==='tasks')return x.title||'a task';
  if(coll==='docs')return(x.company||'')+' '+(x.type||'doc').toLowerCase();
  if(coll==='suggestions')return x.title||'a suggestion';
  if(coll==='ttn')return 'TTN: '+(x.contact||'')+(x.brand?' ('+x.brand+')':'');
  return(x.lead||'')+(x.company?' ('+x.company+')':'')+(x.subject?': '+x.subject:'');
}
function logActivity(coll,id,x,e){
  fetch(ROOT+'/activity.json',{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({at:e.at||Date.now(),by:e.by||'',what:e.what||'',coll:coll,id:id,label:itemLabel(coll,x),status:x.status||'',notified:false})}).catch(function(){});
}
function addLog(c,what){c.log=(c.log||[]).concat([{at:Date.now(),by:who(),what:what}]).slice(-12)}
// History entries get unique keys, so two people adding at once never collide.
function addHistory(lid,e){
  if(!lid)return Promise.resolve();var eid='e'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  e.at=Date.now();return put('/leads/'+encodeURIComponent(lid)+'/history/'+eid,e).then(function(){leads[lid]=leads[lid]||{name:lid};leads[lid].history=leads[lid].history||{};leads[lid].history[eid]=e});
}
function ensureLead(name,company){
  var lid=slug(name);if(leads[lid])return Promise.resolve(lid);
  var l={name:name,company:company||'',history:{}};return put('/leads/'+lid,l).then(function(){leads[lid]=l;return lid});
}

function act(id,kind){
  var label={sent:'marked sent',reply:'marked replied',again:'moved back to Not sent yet',reopen:'reopened',dismiss:'closed without sending',close:'closed'}[kind];
  var before=cards[id];setStatus('Saving…');
  saveCard(id,function(c){
    if(!c)return false;
    if(kind==='sent'){c.status='waiting';c.sentAt=Date.now();c.sentBy=who();c.flag=null;c.followup=null;c.replied=null;c.due=inDays(7)} // check again in a week; editable on the card
    if(kind==='reply'||kind==='dismiss'||kind==='close')c.status='done';
    if(kind==='again'){c.lastSent=lastSentOf(c);c.followup=true;c.status='todo';c.body='';c.due=today()}
    if(kind==='reopen')c.status='todo';
    addLog(c,label);return c;
  }).then(function(r){
    if(r===false){setStatus('That card was deleted.',true);return load(true)}
    if(kind==='sent'&&r.leadId)return addHistory(r.leadId,{date:today(),dir:'out',channel:r.channel||'Email',by:who(),subject:r.subject||'',text:r.body||'',exact:true,cardId:id}).then(function(){return r});
    return r;
  }).then(function(r){
    if(!r)return;
    if(kind==='reply'&&r.leadId){view='leads';openLead=r.leadId;adding={lid:r.leadId,dir:'in'};setStatus('Marked replied. Paste their reply below so it is in the history.');return render()}
    setStatus(kind==='sent'?'Marked sent. The email is now in the Archive and in '+leadName(r.leadId||'')+'’s history.':'Saved.');render();
  }).catch(function(e){setStatus('Not saved ('+e.message+'). Try again.',true)});
}

function copy(text,btn){
  function done(){var o=btn.textContent;btn.textContent='Copied';setTimeout(function(){btn.textContent=o},1400)}
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(done,fallback)}else fallback();
  function fallback(){var t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();try{document.execCommand('copy');done()}catch(e){}document.body.removeChild(t)}
}

  if(c.status!=='done'&&c.due===t)return'<span class="chip due-today">'+esc(c.status==='waiting'?'Check today':'Due today')+'</span>';
  return'<span class="chip">'+esc(label)+'</span>';

  if(c){var meta='';if(c.to)meta+='<div><b>To</b><span>'+esc(c.to)+'</span></div>';if(c.cc)meta+='<div><b>Cc</b><span>'+esc(c.cc)+'</span></div>';if(c.subject)meta+='<div><b>Subject</b><span>'+esc(c.subject)+'</span></div>';if(meta)h+='<div class="meta">'+meta+'</div>';h+=c.body?'<div class="msg">'+linkify(c.body)+'</div>':'<div class="nomsg">Draft to follow.</div>'}
  if(t)h+='<div class="msg">'+esc(t.title)+(t.due?'\nDue '+esc(fmtDay(t.due)):'')+(t.notes?'\n\n'+linkify(t.notes):'')+'</div>';
  if(u){var cur=cards[u.cardId];h+='<div class="from">Changes the card for '+esc(cur?cur.lead:u.cardId)+'</div>';if(cur&&cur.body&&u.fields&&u.fields.body)h+='<div class="was">Now: '+esc(cur.body)+'</div>';if(u.fields&&u.fields.body)h+='<div class="msg">'+linkify(u.fields.body)+'</div>';if(u.fields&&u.fields.note)h+='<div class="note">'+linkify(u.fields.note)+'</div>'}
  if(x.status==='pending')h+='<div class="actions"><button class="btn go" data-sa="add">Add</button><button class="btn" data-sa="dismiss">Dismiss</button></div>';
  else h+='<div class="log">'+(x.status==='added'?'Added':'Dismissed')+' by '+esc(x.by||'')+', '+esc(fmtWhen(x.decidedAt))+'</div>';
  return h+'</article>';
}
function suggestedView(){
  var all=suggList().sort(function(a,b){return(b.createdAt||0)-(a.createdAt||0)});
  var p=all.filter(function(x){return x.status==='pending'}),d=all.filter(function(x){return x.status!=='pending'});
  var h='<div class="note" style="padding:12px 0 0">Suggestions from our calls. Add puts it on the board; Dismiss keeps it on file here.</div>';
  h+=p.length?p.map(suggHtml).join(''):'<div class="empty">Nothing waiting.</div>';
  if(d.length)h+='<details class="donelist"><summary>Decided ('+d.length+')</summary>'+d.slice(0,30).map(suggHtml).join('')+'</details>';
  return h;
}
function suggAct(id,a){
  var x=suggestions[id];if(!x||x.status!=='pending')return;
  if(!meSel.value&&!confirm('Pick who you are at the top first, so we can see who did what. Continue anyway?'))return;
  setStatus('Saving…');
  var step=Promise.resolve();
  if(a==='add'){
    if(x.lead&&x.lead.id&&!leads[x.lead.id])step=step.then(function(){var l=JSON.parse(JSON.stringify(x.lead));var lid=l.id;delete l.id;l.history=l.history||{};return put('/leads/'+lid,l).then(function(){leads[lid]=l})});
    if(x.kind==='card')step=step.then(function(){return saveItem('cards',x.card.id,function(cur){if(cur)throw new Error('that card already exists');var c=JSON.parse(JSON.stringify(x.card));c.status='todo';c.channel='Email';c.log=[];addLog(c,'added this card from a suggestion');return c})});
    if(x.kind==='task')step=step.then(function(){return saveItem('tasks',x.task.id,function(cur){if(cur)throw new Error('that task already exists');var t=JSON.parse(JSON.stringify(x.task));t.status='open';t.log=[];addLog(t,'added this task from a suggestion');return t})});
    if(x.kind==='cardUpdate')step=step.then(function(){return saveItem('cards',x.update.cardId,function(cur){if(!cur)throw new Error('that card is gone');Object.keys(x.update.fields||{}).forEach(function(f){cur[f]=x.update.fields[f]});if(cur.status==='done')cur.status='todo';cur.flag=null;addLog(cur,'changed it from a suggestion');return cur})});
  }
  step.then(function(){return saveItem('suggestions',id,function(cur){if(!cur)return false;cur.status=a==='add'?'added':'dismissed';cur.by=who();cur.decidedAt=Date.now();addLog(cur,a==='add'?'added the suggestion to the board':'dismissed the suggestion');return cur})})
    .then(function(){setStatus(a==='add'?'Added to the board.':'Dismissed. It stays on file under Decided.');render()})
    .catch(function(e){setStatus('Not saved ('+e.message+').',true)});
}

function render(){
  var active=document.activeElement;
  if(active&&active.closest&&active.closest('.edit'))return; // never redraw under someone who is typing
  var all=list(),counts={todo:0,waiting:0,docs:0,tasks:0,suggested:0};
  suggList().forEach(function(x){if(x.status==='pending')counts.suggested++});
  taskList().forEach(function(t){if(t.status!=='done'&&(owner==='All'||t.owner===owner))counts.tasks++});
  all.forEach(function(c){if((owner==='All'||c.owner===owner)&&counts[c.status]!=null)counts[c.status]++});
  docList().forEach(function(d){if(d.status!=='shared'&&(owner==='All'||d.owner===owner))counts.docs++});
  counts.leads=Object.keys(leads).length;
  counts.ttn=ttnList().filter(function(r){return r.status!=='done'&&(owner==='All'||r.owner===owner)}).length;
  var h='<div class="bar"><div class="tabs" id="tabs">';
  ['suggested','todo','ttn','waiting','tasks','docs','archive','leads'].forEach(function(s){if(s==='suggested'&&!counts.suggested&&view!=='suggested')return;h+='<button class="tab '+s+'" data-view="'+s+'" aria-pressed="'+(view===s)+'"><span class="ic">'+TABICON[s]+'</span><span class="t">'+TABS[s]+(counts[s]!=null?'<span class="n">'+counts[s]+'</span>':'')+'</span></button>'});
  h+='</div><div class="subbar"><span class="spacer"></span>';
  if(view!=='leads')['All','Tom','Evan'].forEach(function(o){h+='<button class="who" data-owner="'+o+'" aria-pressed="'+(owner===o)+'">'+o+'</button>'});
  h+='<button class="add" data-a="new">+ Add</button></div></div><div id="status"></div>';
  if(view==='leads')h+=openLead?leadView(openLead):leadsView();
  else if(view==='archive')h+=archiveView();
  else if(view==='docs')h+=docsView();
  else if(view==='tasks')h+=tasksView();
  else if(view==='ttn')h+=ttnView();
  else if(view==='suggested')h+=suggestedView();
  else{
    var shown=all.filter(function(c){return c.status===view&&(owner==='All'||c.owner===owner)});
    shown.sort(function(a,b){return(a.due||'9999').localeCompare(b.due||'9999')||String(a.lead).localeCompare(String(b.lead))});
    h+=shown.length?shown.map(cardHtml).join(''):'<div class="empty">'+(loadedOnce?'Nothing here.':'Loading…')+'</div>';
  }
  var st=document.getElementById('status');var stText=st?st.textContent:'';var stErr=st&&st.className==='err';
  var lq=document.getElementById('lq');var lqFocus=lq&&active===lq;
  var ts=document.getElementById('tabs');var tsx=ts?ts.scrollLeft:0;
  app.innerHTML=h;setStatus(stText,stErr);
  ts=document.getElementById('tabs');if(ts){ts.scrollLeft=tsx;var on=ts.querySelector('[aria-pressed=true]');if(on&&(on.offsetLeft<ts.scrollLeft||on.offsetLeft+on.offsetWidth>ts.scrollLeft+ts.clientWidth))ts.scrollTo({left:on.offsetLeft-2,behavior:'smooth'})}
  if(lqFocus){var n=document.getElementById('lq');n.focus();n.setSelectionRange(n.value.length,n.value.length)}
}

function collect(art,attr){var d={};art.querySelectorAll('['+attr+']').forEach(function(el){d[el.getAttribute(attr)]=el.value});return d}
function blur(){if(document.activeElement)document.activeElement.blur()}

app.addEventListener('wheel',function(ev){var ts=ev.target.closest&&ev.target.closest('.tabs');if(!ts||Math.abs(ev.deltaX)>Math.abs(ev.deltaY)||ts.scrollWidth<=ts.clientWidth)return;var max=ts.scrollWidth-ts.clientWidth;if((ev.deltaY<0&&ts.scrollLeft<=0)||(ev.deltaY>0&&ts.scrollLeft>=max))return;ev.preventDefault();ts.scrollLeft+=ev.deltaY},{passive:false});
app.addEventListener('input',function(ev){if(ev.target.id==='lq'){leadQuery=ev.target.value;render()}});
app.addEventListener('click',function(ev){
  var lk=ev.target.closest('[data-lead]');
  if(lk&&!ev.target.closest('.edit')){view='leads';openLead=lk.dataset.lead;adding=null;convFilter='All';store('fu-view',view);window.scrollTo(0,0);return render()}
  var b=ev.target.closest('button');if(!b)return;
  if(b.dataset.view){view=b.dataset.view;openLead=null;adding=null;store('fu-view',view);return render()}
  if(b.dataset.cf){convFilter=b.dataset.cf;return render()}
  if(b.dataset.owner){owner=b.dataset.owner;store('fu-owner',owner);return render()}
  if(b.dataset.da){var dart=b.closest('.doc');return docAct(dart.dataset.doc,b.dataset.da,dart)}
  if(b.dataset.xa){var xart=b.closest('.ttnrow');return ttnAct(xart.dataset.ttn,b.dataset.xa,xart)}
  if(b.dataset.ta){var tart=b.closest('.task');return taskAct(tart.dataset.task,b.dataset.ta,tart)}
  if(b.dataset.sa){return suggAct(b.closest('.sugg').dataset.sugg,b.dataset.sa)}
  if(b.dataset.why){var tw=b.closest('.card').querySelector('[data-x="why"]');tw.value=(tw.value.trim()?tw.value.trim()+'. ':'')+b.dataset.why+': ';tw.focus();tw.setSelectionRange(tw.value.length,tw.value.length);return}
  var a=b.dataset.a;if(!a)return;
  if(a==='new'&&view==='tasks'){
    var tid='t'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    tasks[tid]={id:tid,title:'',owner:meSel.value||'Evan',due:today(),notes:'',leadId:'',status:'open',log:[]};
    editingTask[tid]=JSON.parse(JSON.stringify(tasks[tid]));editingTask[tid]._new=true;render();
    var tf=app.querySelector('[data-task="'+tid+'"] [data-t="title"]');if(tf)tf.focus();return;
  }
  if(a==='new'&&view==='ttn'){
    var xid='x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    ttn[xid]={id:xid,contact:'',brand:'',title:'',linkedin:'',firstInMail:'',replyDate:today(),reply:'',asked:'',email:'',next:'',owner:'Tom',status:'new',remind:'',notes:'',log:[]};
    editingTtn[xid]=JSON.parse(JSON.stringify(ttn[xid]));editingTtn[xid]._new=true;render();
    var xf=app.querySelector('[data-ttn="'+xid+'"] [data-n="contact"]');if(xf)xf.focus();return;
  }
  if(a==='new'&&view==='docs'){
    var did='d'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    docs[did]={id:did,company:'',lead:'',leadId:'',type:'Strategy doc',owner:'Tom',link:'',due:today(),ask:'',status:'review',log:[]};
    editingDoc[did]=JSON.parse(JSON.stringify(docs[did]));editingDoc[did]._new=true;render();
    var f=app.querySelector('[data-doc="'+did+'"] [data-d="company"]');if(f)f.focus();return;
  }
  if(a==='back'){openLead=null;adding=null;return render()}
  if(a==='newev'){adding={lid:b.dataset.l,dir:'in'};render();var t=app.querySelector('[data-g="text"]');if(t)t.focus();return}
  if(a==='cancelev'){adding=null;blur();return render()}
  if(a==='addev'){
    var form=b.closest('.card');var d=collect(form,'data-g');if(!d.text.trim()){setStatus('Write or paste something first.',true);return}
    setStatus('Saving…');
    addHistory(b.dataset.l,{date:d.date||today(),dir:d.dir,channel:d.channel,by:d.dir==='in'?leadName(b.dataset.l).split(' ')[0]:who(),subject:d.subject,text:d.text,exact:true})
      .then(function(){adding=null;blur();setStatus('Added to the history.');render()}).catch(function(e){setStatus('Not saved ('+e.message+'). Try again.',true)});
    return;
  }
  if(a==='new'){
    var id='c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    var c={id:id,lead:'',company:'',leadId:openLead||'',owner:meSel.value||'Tom',channel:'Email',to:'',cc:'',subject:'',body:'',note:'',status:'todo',due:today(),links:[],log:[]};
    if(openLead){c.lead=leadName(openLead);c.company=(leads[openLead]||{}).company||''}
    cards[id]=c;editing[id]={base:0,draft:JSON.parse(JSON.stringify(c)),isNew:true};view='todo';openLead=null;render();
    var el=app.querySelector('[data-id="'+id+'"] [data-f="'+(c.lead?'body':'lead')+'"]');if(el)el.focus();return;
  }
  var art=b.closest('.card');var id=art&&art.dataset.id;var c=cards[id];if(!c)return;
  if(a==='copybody')return copy(c.body,b);
  if(a==='copysubj')return copy(c.subject,b);
  if(a==='edit'){editing[id]={base:c.rev||0,draft:JSON.parse(JSON.stringify(c))};return render()}
  if(a==='cancel'){if(editing[id]&&editing[id].isNew)delete cards[id];delete editing[id];delete conflicts[id];blur();return render()}
  if(a==='save'||a==='keepmine'){
    var d=Object.assign(editing[id].draft,collect(art,'data-f'));var base=editing[id].base,isNew=editing[id].isNew,force=a==='keepmine';
    if(!d.lead.trim()){setStatus('Add a lead name first.',true);return}
    setStatus('Saving…');
    (d.leadId?Promise.resolve(d.leadId):ensureLead(d.lead.trim(),d.company)).then(function(lid){
      d.leadId=lid;
      return saveCard(id,function(cur){
        if(!isNew&&!cur)return false;
        if(cur&&!force&&(cur.rev||0)!==base){conflicts[id]=cur;throw new Error('conflict')}
        var next=cur||{id:id,status:'todo',links:[],log:[]};
        ['lead','company','leadId','owner','due','to','cc','subject','body','note'].forEach(function(f){next[f]=d[f]||''});next.channel='Email'; // the board holds email only (Evan, 3 Nov)
        if(!isNew)next.flag=null;
        addLog(next,isNew?'added this card':'edited this card');return next;
      });
    }).then(function(r){
      if(r===false){setStatus('That card was deleted.',true);delete editing[id];blur();return load(true)}
      delete editing[id];delete conflicts[id];blur();setStatus('Saved.');render();
    }).catch(function(e){if(e.message==='conflict'){setStatus('');blur();render();return}setStatus('Not saved ('+e.message+'). Your text is still here; try again.',true)});
    return;
  }
  if(a==='flag'){flagging[id]='';render();var w=art.querySelector('[data-x="why"]');if(w)w.focus();return}
  if(a==='flagcancel'){delete flagging[id];blur();return render()}
  if(a==='flagrewrite'||a==='flagclose'){
    var why=(art.querySelector('[data-x="why"]')||{}).value||'';why=why.trim();
    if(a==='flagrewrite'&&!why){setStatus('Say what changed, so the new draft gets it right.',true);return}
    setStatus('Saving…');
    saveCard(id,function(cur){
      if(!cur)return false;
      if(a==='flagrewrite'){cur.status='todo';cur.flag={why:why,by:who(),at:Date.now()};addLog(cur,'asked for a rewrite: '+why)}
      else{cur.status='done';cur.flag=null;cur.closedWhy=why;addLog(cur,'closed it as not needed'+(why?': '+why:''))}
      return cur;
    }).then(function(r){
      delete flagging[id];blur();
      if(r===false){setStatus('That card was deleted.',true);return load(true)}
      setStatus(a==='flagrewrite'?'Flagged. Claude picks it up and writes a new draft; it stays in Not sent yet.':'Closed. It is in the Archive under Closed.');render();
    }).catch(function(e){setStatus('Not saved ('+e.message+'). Your note is still here; try again.',true)});
    return;
  }
  if(a==='usesaved'){cards[id]=conflicts[id];delete conflicts[id];delete editing[id];blur();return render()}
  if(!meSel.value&&!confirm('Pick who you are at the top first, so we can see who did what. Continue anyway?'))return;
  act(id,a);
});

load();
setInterval(function(){if(!document.hidden&&!busy())load(true)},30000);
document.addEventListener('visibilitychange',function(){if(!document.hidden&&!busy())load(true)});
})();
</script>
